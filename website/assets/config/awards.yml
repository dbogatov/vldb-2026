endowment:
  - title: 2026 VLDB Early Career Research Contribution Award
    recipient: Jana Giceva
    affiliation: Technical University of Munich
    photo: jana-giceva
    profile: https://www.professoren.tum.de/en/giceva-jana
    article: https://www.vldb.org/pvldb/vol19/p4965-giceva.pdf
    citation: >-
      Jana Giceva is recognized for visionary contributions to building data
      systems whose core software abstractions decouple logical intent from
      physical hardware microarchitectures, advancing the flexibility,
      extensibility, and performance of data systems across evolving workloads
      and hardware platforms.

  - title: 2026 VLDB Women in Database Research Award
    recipient: Juliana Freire
    affiliation: New York University
    photo: juliana-freire
    profile: https://engineering.nyu.edu/faculty/juliana-freire
    article: https://www.vldb.org/pvldb/vol19/p4973-freire.pdf
    citation: >-
      Juliana Freire is recognized for pioneering contributions in provenance,
      reproducibility and urban data science, and for transformative leadership
      in the data management community.

  - title: 2026 VLDB Test of Time Award
    paper_title: >-
      The Dataflow Model: A Practical Approach to Balancing Correctness,
      Latency, and Cost in Massive-scale, Unbounded, Out-of-order Data Processing
    authors: >-
      Tyler Akidau, Robert Bradshaw, Craig Chambers, Slava Chernyak,
      Rafael Fernández-Moctezuma, Reuven Lax, Sam McVeety, Daniel Mills,
      Frances Perry, Eric Schmidt, Sam Whittle
    article: https://www.vldb.org/pvldb/vol19/p4953-fernandez-moctezuma.pdf
    citation: >-
      "The Dataflow Model: A Practical Approach to Balancing Correctness,
      Latency, and Cost in Massive-scale, Unbounded, Out-of-order Data
      Processing" is recognized for establishing the foundational vocabulary
      and conceptual framework — watermarks, triggers, and flexible windowing —
      that define modern stream processing, directly shaping Apache Beam and
      influencing the design of Flink and Spark Structured Streaming, while
      continuing to anchor academic work on streaming semantics a decade later.

